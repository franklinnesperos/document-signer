<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input[type="file"], input[type="number"], input[type="date"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-purple { background: #6f42c1; color: white; font-size: 15px; }
        .btn-blue { background: #007bff; color: white; font-size: 15px; }

        #docWrapper {
            position: relative;
            margin-top: 15px;
            border: 2px dashed #ccc;
            padding: 20px;
            background: #525659;
            border-radius: 4px;
            overflow-y: auto;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Mismong Pahina batay sa aktwal na file size */
        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: none;
            box-sizing: border-box;
            overflow: hidden;
            transition: all 0.2s ease;
            margin-bottom: 10px;
        }

        /* Center Guide Lines (Horizon & Vertical Center Snapping) */
        .center-guide-h {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            border-top: 1px dashed red;
            display: none;
            z-index: 15;
            pointer-events: none;
        }

        .center-guide-v {
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            border-left: 1px dashed red;
            display: none;
            z-index: 15;
            pointer-events: none;
        }

        .targetElementWrapper {
            position: relative;
            margin: 0 auto;
            width: 100%;
            height: 100%;
            border: 2px dashed transparent; /* Naka-lock muna */
            cursor: default;
            user-select: none;
            touch-action: none;
            display: block;
            box-sizing: border-box;
            background: transparent;
        }

        /* Kapag na-double click na (Aktibo / Unlocked para i-drag o i-resize) */
        .targetElementWrapper.active-edit {
            border: 2px dashed #007bff;
            cursor: move;
            background: rgba(0, 123, 255, 0.02);
        }

        .targetElementWrapper img, .targetElementWrapper canvas, .targetElementWrapper div {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .resizer {
            width: 12px;
            height: 12px;
            background: #007bff;
            border: 2px solid white;
            position: absolute;
            z-index: 30;
            border-radius: 50%;
            display: none;
        }
        .targetElementWrapper.active-edit .resizer {
            display: block;
        }

        .resizer.nw { top: -7px; left: -7px; cursor: nwse-resize; }
        .resizer.ne { top: -7px; right: -7px; cursor: nesw-resize; }
        .resizer.sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .resizer.se { bottom: -7px; right: -7px; cursor: nwse-resize; }

        .toolbar-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
            background: #eef2f7;
            padding: 10px;
            border-radius: 6px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .rotation-badge {
            background: #000;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .page-size-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 50;
            pointer-events: none;
        }

        .draggable-item {
            position: absolute;
            top: 40px;
            left: 40px;
            cursor: move;
            border: 1.5px dashed #28a745;
            padding: 4px;
            background: rgba(255, 255, 255, 0.8);
            user-select: none;
            touch-action: none;
            z-index: 1000;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 30px;
            text-align: left;
        }

        .draggable-item img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .draggable-item .custom-text-node {
            font-weight: bold;
            color: #000;
            line-height: 1.3;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .delete-btn {
            font-size: 12px;
            color: red;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            top: 0; right: 0;
            background: white;
            padding: 2px 6px;
            border-radius: 0 0 0 4px;
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            z-index: 40;
        }

        .modal {
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 420px; box-sizing: border-box; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }

        .developer-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF, Word, Excel, Image):</label>
        <input type="file" id="fileInput" accept=".pdf, .docx, .xlsx, .xls, .csv, image/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Interactive Rotation Toolbar -->
    <div class="toolbar-controls">
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="rotateDocument(-5)">🔄 -5°</button>
            <button class="btn btn-secondary" onclick="rotateDocument(5)">🔄 +5°</button>
            <button class="btn btn-secondary" onclick="rotateDocument(90)">🔄 +90°</button>
            <button class="btn btn-purple" onclick="openSigModal()">✍️ Magdagdag ng Pirma</button>
        </div>
        <div class="rotation-badge" id="rotationBadge">Anggulo: 0°</div>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <p id="initialPlaceholderMessage" style="color: #ccc; font-style: italic; text-align: center; padding: 50px;">Wala pang naka-upload na file. Mag-upload sa itaas upang magsimula.</p>
        <div id="pagesContainerWrapper" style="display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: center;"></div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Add Custom Text -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px; background: #fdfdfd; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
        <h3 style="margin-top: 0; color: #0056b3;">📝 Magdagdag ng Custom Text (Multi-line)</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="flex: 3; min-width: 200px; margin-bottom: 0;">
                <label>Teksto (Pindutin ang Enter para sa bagong linya):</label>
                <textarea id="customTextInput" rows="2" placeholder="Hal. Noong 1521..."></textarea>
            </div>
            <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                <label>Font Size (pt):</label>
                <input type="number" id="fontSizeInput" value="14" min="8" max="72">
            </div>
            <div style="flex: 1; min-width: 120px;">
                <button class="btn btn-blue" style="width: 100%;" onclick="addCustomTextToFirstPage()">➕ Add Text</button>
            </div>
        </div>
    </div>

    <!-- Save Button Box -->
    <div style="margin-top: 15px;">
        <button class="btn btn-green" onclick="saveAllAsPDF()">💾 I-save at I-download bilang PDF</button>
    </div>

    <!-- Developer Footer -->
    <div class="developer-footer">
        Developer: Franklin P. Nesperos
    </div>
</div>

<!-- Signature Modal -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">✍️ Lagda at Detalye</h3>
        <canvas id="sigCanvas" width="340" height="150"></canvas>
        
        <div style="margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #eee;">
            <div class="form-group">
                <label>Pangalan / Printed Name (Optional):</label>
                <input type="text" id="modalSignerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Petsa / Date (Optional):</label>
                <input type="date" id="modalSigningDate">
            </div>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 8px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura Canvas</button>
            <button class="btn btn-purple" onclick="saveSignature()">Idagdag sa Unang Pahina</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let currentFileType = "";
    let currentRotation = 0;
    let detectedDimensions = { width: 612, height: 792 };

    const rotationBadge = document.getElementById("rotationBadge");
    const fileInfo = document.getElementById("fileInfo");
    const initialPlaceholderMessage = document.getElementById("initialPlaceholderMessage");
    const pagesContainerWrapper = document.getElementById("pagesContainerWrapper");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentFileType = file.type;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();
        currentRotation = 0;
        updateRotationUI();

        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            initialPlaceholderMessage.style.display = "none";
            pagesContainerWrapper.innerHTML = "";
            renderDocument(file);
        };

        if (fileName.endsWith(".pdf") || currentFileType === "application/pdf") {
            currentFileType = "pdf";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".docx")) {
            currentFileType = "docx";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls") || fileName.endsWith(".csv")) {
            currentFileType = "excel";
            reader.readAsArrayBuffer(file);
        } else if (file.type.startsWith("image/")) {
            currentFileType = "image";
            reader.readAsDataURL(file);
        } else {
            alert("Format not supported.");
        }
    }

    function renderDocument(file) {
        if (currentFileType === "pdf") {
            pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
                fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDoc.numPages} Pahina)`;
                pdfDoc.getPage(1).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.5 });
                    detectedDimensions = { width: viewport.width, height: viewport.height };
                    
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        createPageAndRenderPDF(pdfDoc, i);
                    }
                });
            });
        } else if (currentFileType === "image") {
            fileInfo.textContent = "Image Document";
            const img = new Image();
            img.src = currentFileArrayBuffer;
            img.onload = function() {
                detectedDimensions = { width: img.naturalWidth, height: img.naturalHeight };
                const pageContainer = createPageContainer(1, detectedDimensions.width, detectedDimensions.height);
                const placeholder = pageContainer.querySelector('.fileInnerPlaceholder');
                placeholder.appendChild(img);
                pagesContainerWrapper.appendChild(pageContainer);
            };
        } else {
            fileInfo.textContent = "Office Document";
            detectedDimensions = { width: 792, height: 612 };
            const pageContainer = createPageContainer(1, detectedDimensions.width, detectedDimensions.height);
            const placeholder = pageContainer.querySelector('.fileInnerPlaceholder');

            const innerDiv = document.createElement("div");
            innerDiv.style.width = "100%";
            innerDiv.style.height = "auto";
            innerDiv.style.overflow = "visible";

            if (currentFileType === "docx") {
                mammoth.convertToHtml({ arrayBuffer: currentFileArrayBuffer }).then(function(result) {
                    innerDiv.innerHTML = result.value;
                });
            } else {
                const data = new Uint8Array(currentFileArrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                innerDiv.innerHTML = XLSX.utils.sheet_to_html(firstSheet);
            }
            placeholder.appendChild(innerDiv);
            pagesContainerWrapper.appendChild(pageContainer);
        }
    }

    function createPageContainer(pageNum, width, height) {
        const pageContainer = document.createElement("div");
        pageContainer.className = "page-container";
        pageContainer.style.display = "block";
        pageContainer.style.width = width + "px";
        pageContainer.style.height = height + "px";
        pageContainer.dataset.pageNum = pageNum;

        const badge = document.createElement("div");
        badge.className = "page-size-badge";
        badge.textContent = `Pahina ${pageNum}`;

        const guideH = document.createElement("div");
        guideH.className = "center-guide-h";
        const guideV = document.createElement("div");
        guideV.className = "center-guide-v";

        const targetWrapper = document.createElement("div");
        targetWrapper.className = "targetElementWrapper";

        ['nw', 'ne', 'sw', 'se'].forEach(dir => {
            const resizer = document.createElement("div");
            resizer.className = `resizer ${dir}`;
            makeResizable(resizer, targetWrapper, pageContainer, guideH, guideV, dir);
            targetWrapper.appendChild(resizer);
        });

        const innerPlaceholder = document.createElement("div");
        innerPlaceholder.className = "fileInnerPlaceholder";
        innerPlaceholder.style.width = "100%";
        innerPlaceholder.style.height = "100%";
        targetWrapper.appendChild(innerPlaceholder);

        // Double-Click para i-activate / i-unlock ang paggalaw o pag-resize
        targetWrapper.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.targetElementWrapper').forEach(el => el.classList.remove('active-edit'));
            targetWrapper.classList.add('active-edit');
        });

        pageContainer.addEventListener('click', (e) => {
            if (e.target === pageContainer) {
                targetWrapper.classList.remove('active-edit');
                guideH.style.display = 'none';
                guideV.style.display = 'none';
            }
        });

        pageContainer.appendChild(badge);
        pageContainer.appendChild(guideH);
        pageContainer.appendChild(guideV);
        pageContainer.appendChild(targetWrapper);

        makeElementDraggable(targetWrapper, pageContainer, guideH, guideV);

        return pageContainer;
    }

    function createPageAndRenderPDF(pdfDoc, pageNum) {
        pdfDoc.getPage(pageNum).then(function(page) {
            const viewport = page.getViewport({ scale: 1.5 });
            const pageContainer = createPageContainer(pageNum, viewport.width, viewport.height);
            const placeholder = pageContainer.querySelector('.fileInnerPlaceholder');

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            placeholder.appendChild(canvas);
            
            page.render({ canvasContext: context, viewport: viewport });
            pagesContainerWrapper.appendChild(pageContainer);
        });
    }

    function makeResizable(resizer, element, pageContainer, guideH, guideV, direction) {
        resizer.addEventListener('mousedown', initResize);
        resizer.addEventListener('touchstart', initResize);

        function initResize(e) {
            if (!element.classList.contains('active-edit')) return;
            e.stopPropagation();
            const startX = e.clientX || e.touches[0].clientX;
            const startY = e.clientY || e.touches[0].clientY;
            const startWidth = element.offsetWidth;
            const startHeight = element.offsetHeight;
            const startLeft = element.offsetLeft;
            const startTop = element.offsetTop;

            const pageWidth = pageContainer.clientWidth;

            function doResize(e) {
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;

                let newWidth = startWidth;
                let newHeight = startHeight;
                let newLeft = startLeft;
                let newTop = startTop;

                if (direction.includes('e')) newWidth = startWidth + dx;
                if (direction.includes('s')) newHeight = startHeight + dy;
                if (direction.includes('w')) {
                    newWidth = startWidth - dx;
                    newLeft = startLeft + dx;
                }
                if (direction.includes('n')) {
                    newHeight = startHeight - dy;
                    newTop = startTop + dy;
                }

                // Center Snapping Check habang nagpapalaki/nagpapaliit
                const currentCenterX = newLeft + (newWidth / 2);
                const pageCenterX = pageWidth / 2;
                if (Math.abs(currentCenterX - pageCenterX) < 6) {
                    newLeft = pageCenterX - (newWidth / 2);
                    guideV.style.display = 'block';
                } else {
                    guideV.style.display = 'none';
                }

                element.style.width = newWidth + 'px';
                element.style.height = newHeight + 'px';
                element.style.left = newLeft + 'px';
                element.style.top = newTop + 'px';
            }

            function stopResize() {
                guideH.style.display = 'none';
                guideV.style.display = 'none';
                window.removeEventListener('mousemove', doResize);
                window.removeEventListener('mouseup', stopResize);
                window.removeEventListener('touchmove', doResize);
                window.removeEventListener('touchend', stopResize);
            }

            window.addEventListener('mousemove', doResize);
            window.addEventListener('mouseup', stopResize);
            window.addEventListener('touchmove', doResize);
            window.addEventListener('touchend', stopResize);
        }
    }

    function makeElementDraggable(elmnt, pageContainer, guideH, guideV) {
        let startX = 0, startY = 0, initialX = 0, initialY = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (!elmnt.classList.contains('active-edit')) return;
            if (e.target.classList.contains('resizer')) return;
            e.preventDefault();
            startX = e.clientX; startY = e.clientY;
            initialX = elmnt.offsetLeft; initialY = elmnt.offsetTop;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            let newX = initialX + (e.clientX - startX);
            let newY = initialY + (e.clientY - startY);

            const pageWidth = pageContainer.clientWidth;
            const pageHeight = pageContainer.clientHeight;
            const elemWidth = elmnt.offsetWidth;
            const elemHeight = elmnt.offsetHeight;

            const centerX = newX + (elemWidth / 2);
            const centerY = newY + (elemHeight / 2);

            const targetCenterX = pageWidth / 2;
            const targetCenterY = pageHeight / 2;

            if (Math.abs(centerX - targetCenterX) < 8) {
                newX = targetCenterX - (elemWidth / 2);
                guideV.style.display = 'block';
            } else {
                guideV.style.display = 'none';
            }

            if (Math.abs(centerY - targetCenterY) < 8) {
                newY = targetCenterY - (elemHeight / 2);
                guideH.style.display = 'block';
            } else {
                guideH.style.display = 'none';
            }

            elmnt.style.left = newX + "px";
            elmnt.style.top = newY + "px";
        }

        function closeDragElement() {
            guideH.style.display = 'none';
            guideV.style.display = 'none';
            document.onmouseup = null;
            document.onmousemove = null;
        }

        function dragTouchStart(e) {
            if (!elmnt.classList.contains('active-edit')) return;
            if (e.target.classList.contains('resizer')) return;
            const touch = e.touches[0];
            startX = touch.clientX; startY = touch.clientY;
            initialX = elmnt.offsetLeft; initialY = elmnt.offsetTop;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchTouchDragMove;
        }

        function touchTouchDragMove(e) {
            const touch = e.touches[0];
            let newX = initialX + (touch.clientX - startX);
            let newY = initialY + (touch.clientY - startY);

            const pageWidth = pageContainer.clientWidth;
            const pageHeight = pageContainer.clientHeight;
            const elemWidth = elmnt.offsetWidth;
            const elemHeight = elmnt.offsetHeight;

            const centerX = newX + (elemWidth / 2);
            const centerY = newY + (elemHeight / 2);

            const targetCenterX = pageWidth / 2;
            const targetCenterY = pageHeight / 2;

            if (Math.abs(centerX - targetCenterX) < 8) {
                newX = targetCenterX - (elemWidth / 2);
                guideV.style.display = 'block';
            } else {
                guideV.style.display = 'none';
            }

            if (Math.abs(centerY - targetCenterY) < 8) {
                newY = targetCenterY - (elemHeight / 2);
                guideH.style.display = 'block';
            } else {
                guideH.style.display = 'none';
            }

            elmnt.style.left = newX + "px";
            elmnt.style.top = newY + "px";
        }

        function closeTouchDrag() {
            guideH.style.display = 'none';
            guideV.style.display = 'none';
            document.ontouchend = null;
            document.ontouchmove = null;
        }
    }

    function rotateDocument(angleChange) {
        currentRotation = (currentRotation + angleChange) % 360;
        if (currentRotation < 0) currentRotation += 360;
        updateRotationUI();
    }

    function updateRotationUI() {
        rotationBadge.textContent = `Anggulo: ${currentRotation}°`;
        document.querySelectorAll(".targetElementWrapper").forEach(target => {
            target.style.transform = `rotate(${currentRotation}deg)`;
        });
    }

    /* Signature Modal Logic */
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { sigModal.style.display = "flex"; clearCanvas(); }
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    function saveSignature() {
        const firstPage = document.querySelector(".page-container");
        if (!firstPage) { alert("Mag-upload muna ng dokumento."); return; }

        const nameVal = document.getElementById("modalSignerName").value.trim();
        const dateVal = document.getElementById("modalSigningDate").value;

        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        let hasDrawing = false;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] > 0 && (data[i] < 220 || data[i+1] < 220 || data[i+2] < 220)) hasDrawing = true;
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) data[i+3] = 0; 
        }
        ctx.putImageData(imgData, 0, 0);

        const div = document.createElement("div");
        div.className = "draggable-item";

        let contentHTML = "";
        if (hasDrawing) {
            const signaturePngBase64 = sigCanvas.toDataURL("image/png");
            contentHTML += `<img src="${signaturePngBase64}" alt="Signature">`;
        }
        if (nameVal || dateVal) {
            contentHTML += `<div class="custom-text-node" style="font-size: 12px; margin-top: 4px;">${nameVal ? nameVal : ''}${nameVal && dateVal ? '<br>' : ''}${dateVal ? dateVal : ''}</div>`;
        }

        div.innerHTML = contentHTML + `<span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        firstPage.appendChild(div);
        makeDraggableSignature(div);
        closeSigModal();
    }

    function addCustomTextToFirstPage() {
        const textVal = document.getElementById("customTextInput").value.trim();
        const fontSizeVal = document.getElementById("fontSizeInput").value || 14;
        if (!textVal) { alert("Pakitype muna ang teksto."); return; }

        const firstPage = document.querySelector(".page-container");
        if (!firstPage) { alert("Mag-upload muna ng dokumento."); return; }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.style.background = "transparent";
        div.innerHTML = `<div class="custom-text-node" style="font-size: ${fontSizeVal}px;">${textVal}</div><span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        
        firstPage.appendChild(div);
        makeDraggableSignature(div);
        document.getElementById("customTextInput").value = "";
    }

    function makeDraggableSignature(elmnt) {
        let startX = 0, startY = 0, initialX = 0, initialY = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            startX = e.clientX; startY = e.clientY;
            initialX = elmnt.offsetLeft; initialY = elmnt.offsetTop;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            elmnt.style.left = (initialX + (e.clientX - startX)) + "px";
            elmnt.style.top = (initialY + (e.clientY - startY)) + "px";
        }

        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }

        function dragTouchStart(e) {
            if (e.target.classList.contains('delete-btn')) return;
            const touch = e.touches[0];
            startX = touch.clientX; startY = touch.clientY;
            initialX = elmnt.offsetLeft; initialY = elmnt.offsetTop;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchTouchDragMove;
        }

        function touchTouchDragMove(e) {
            const touch = e.touches[0];
            elmnt.style.left = (initialX + (touch.clientX - startX)) + "px";
            elmnt.style.top = (initialY + (touch.clientY - startY)) + "px";
        }

        function closeTouchDrag() { document.ontouchend = null; document.ontouchmove = null; }
    }

    function saveAllAsPDF() {
        const deleteBtns = document.querySelectorAll(".delete-btn, .resizer");
        const badges = document.querySelectorAll(".page-size-badge");
        const guides = document.querySelectorAll(".center-guide-h, .center-guide-v");
        
        deleteBtns.forEach(btn => btn.style.display = "none");
        badges.forEach(b => b.style.display = "none");
        guides.forEach(g => g.style.display = "none");

        const opt = {
            margin:       0,
            filename:     'Signed_Document_All_Pages.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'px', format: [detectedDimensions.width, detectedDimensions.height], compress: true }
        };

        html2pdf().set(opt).from(pagesContainerWrapper).save().then(() => {
            deleteBtns.forEach(btn => btn.style.display = "block");
            badges.forEach(b => b.style.display = "block");
        });
    }
</script>
