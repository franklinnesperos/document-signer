<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries para sa PDF, Word, Excel, at Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input[type="file"], input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-purple { background: #6f42c1; color: white; font-size: 15px; }
        .btn-blue { background: #007bff; color: white; font-size: 15px; }

        /* Workspace */
        #docWrapper {
            position: relative;
            margin-top: 15px;
            border: 2px dashed #ccc;
            padding: 0;
            background: #525659;
            border-radius: 4px;
            overflow: auto;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        #docContent {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-block;
            overflow: visible !important;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box;
            line-height: 0;
        }

        .page-container canvas {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
        }

        /* Badge para sa Page Size */
        .page-size-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            line-height: 1.2;
            border-radius: 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Draggable & Resizable Items */
        .draggable-item {
            position: absolute;
            top: 50px;
            left: 50px;
            cursor: move;
            border: 1.5px dashed #007bff;
            padding: 4px;
            background: rgba(255, 255, 255, 0.6);
            user-select: none;
            touch-action: none;
            z-index: 1000;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 30px;
            text-align: center;
            line-height: 1.2;
        }

        .draggable-item img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .draggable-item .custom-text-node {
            font-weight: bold;
            color: #000;
            line-height: 1.2;
            pointer-events: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .delete-btn {
            font-size: 12px;
            color: red;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            top: 0; right: 0;
            background: white;
            padding: 2px 6px;
            border-radius: 0 0 0 4px;
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            z-index: 10;
            line-height: 1;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 420px; box-sizing: border-box; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }
        .excel-table { border-collapse: collapse; width: 100%; font-size: 12px; }
        .excel-table th, .excel-table td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }

        /* Developer Footer Style */
        .developer-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            padding: 12px;
            background: linear-gradient(135deg, #0056b3, #d9534f);
            border-radius: 6px;
            color: #ffffff;
            text-shadow: 
                -1px -1px 0 #ffeb3b,
                 1px -1px 0 #ffeb3b,
                -1px  1px 0 #ffeb3b,
                 1px  1px 0 #ffeb3b,
                 2px  2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            border: 2px solid #ffeb3b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF, Word, Excel, Image):</label>
        <input type="file" id="fileInput" accept=".pdf, .docx, .xlsx, .xls, .csv, image/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Sukat ng Papel (Paper Size Selection) -->
    <div class="form-group">
        <label>Sukat ng Papel (Paper Size para sa Export):</label>
        <select id="paperSize">
            <option value="a4">A4</option>
            <option value="letter" selected>Letter (8.5 × 11 in)</option>
            <option value="legal8513">8.5 × 13 in (Long)</option>
            <option value="legal">US Legal (8.5 × 14 in)</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn btn-purple" onclick="openSigModal()">✍️ Magdagdag ng Pirma / Detalye</button>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <div id="docContent">
            <p style="color: #ccc; font-style: italic; padding: 40px; text-align: center;">Wala pang naka-upload na dokumento.</p>
        </div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Add Custom Text Box -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px; background: #fdfdfd; padding: 15px; border-radius: 6px; border: 1px solid #eee;">
        <h3 style="margin-top: 0; color: #0056b3;">📝 Magdagdag ng Custom Text</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group" style="flex: 3; min-width: 200px; margin-bottom: 0;">
                <label>Teksto na ilalagay (Text):</label>
                <input type="text" id="customTextInput" placeholder="Hal. APPROVED, RECEIVED, o Karagdagang Tala...">
            </div>
            <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
                <label>Font Size (pt):</label>
                <input type="number" id="fontSizeInput" value="14" min="8" max="72">
            </div>
            <div style="flex: 1; min-width: 120px;">
                <button class="btn btn-blue" style="width: 100%;" onclick="addCustomTextToDoc()">➕ Add Text</button>
            </div>
        </div>
        <p style="font-size: 12px; color: #666; margin-top: 8px; margin-bottom: 0;">* Ang naidagdag na teksto ay pwedeng i-drag at ilagay sa kahit anong pahina.</p>
    </div>

    <!-- Save Button Box -->
    <div style="margin-top: 15px;">
        <button class="btn btn-green" onclick="saveAllAsPDF()">💾 I-save at I-download bilang PDF</button>
    </div>

    <!-- Developer Footer -->
    <div class="developer-footer">
        Developer: Franklin Nesperos
    </div>
</div>

<!-- Signature Modal -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">✍️ Lagda at Detalye</h3>
        <canvas id="sigCanvas" width="340" height="150"></canvas>
        
        <div style="margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #eee;">
            <div class="form-group">
                <label>Pangalan / Printed Name (Optional):</label>
                <input type="text" id="modalSignerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Petsa / Date (Optional):</label>
                <input type="date" id="modalSigningDate">
            </div>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 8px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura Canvas</button>
            <button class="btn btn-purple" onclick="saveSignature()">Idagdag sa Dokyumento</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let currentFileType = "";

    const docContent = document.getElementById("docContent");
    const fileInfo = document.getElementById("fileInfo");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentFileType = file.type;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            renderDocument(file);
        };

        if (fileName.endsWith(".pdf") || currentFileType === "application/pdf") {
            currentFileType = "pdf";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".docx")) {
            currentFileType = "docx";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls") || fileName.endsWith(".csv")) {
            currentFileType = "excel";
            reader.readAsArrayBuffer(file);
        } else if (file.type.startsWith("image/")) {
            currentFileType = "image";
            reader.readAsDataURL(file);
        } else {
            alert("Format not supported.");
        }
    }

    function renderDocument(file) {
        docContent.innerHTML = "";

        if (currentFileType === "pdf") {
            pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
                fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDoc.numPages} Pahina)`;

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    pdfDoc.getPage(i).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.5 });
                        const pdfView = page.getViewport({ scale: 1.0 });
                        const widthInches = (pdfView.width / 72).toFixed(1);
                        const heightInches = (pdfView.height / 72).toFixed(1);
                        let sizeName = getPaperSizeName(pdfView.width, pdfView.height);

                        const container = document.createElement("div");
                        container.className = "page-container";
                        container.dataset.pageNum = i;

                        const badge = document.createElement("div");
                        badge.className = "page-size-badge";
                        badge.textContent = `Pahina ${i}: ${sizeName} (${widthInches}" x ${heightInches}")`;
                        container.appendChild(badge);

                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        container.appendChild(canvas);

                        docContent.appendChild(container);
                        page.render({ canvasContext: context, viewport: viewport });
                    });
                }
            });
        } else if (currentFileType === "docx") {
            mammoth.convertToHtml({ arrayBuffer: currentFileArrayBuffer })
                .then(function(result) {
                    const container = document.createElement("div");
                    container.className = "page-container";
                    container.style.padding = "20px";
                    container.style.lineHeight = "normal";
                    container.dataset.pageNum = 1;
                    
                    const badge = document.createElement("div");
                    badge.className = "page-size-badge";
                    badge.textContent = "Word Document (.docx)";
                    container.appendChild(badge);

                    const innerDiv = document.createElement("div");
                    innerDiv.style.marginTop = "30px";
                    innerDiv.innerHTML = result.value;
                    container.appendChild(innerDiv);

                    docContent.appendChild(container);
                    fileInfo.textContent = "Microsoft Word Document (.docx)";
                });
        } else if (currentFileType === "excel") {
            const data = new Uint8Array(currentFileArrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const htmlString = XLSX.utils.sheet_to_html(firstSheet);
            
            const container = document.createElement("div");
            container.className = "page-container";
            container.style.padding = "20px";
            container.style.lineHeight = "normal";
            container.dataset.pageNum = 1;

            const badge = document.createElement("div");
            badge.className = "page-size-badge";
            badge.textContent = "Excel Spreadsheet";
            container.appendChild(badge);

            const innerDiv = document.createElement("div");
            innerDiv.style.marginTop = "30px";
            innerDiv.innerHTML = htmlString;
            const tbl = innerDiv.querySelector("table");
            if (tbl) tbl.className = "excel-table";
            container.appendChild(innerDiv);

            docContent.appendChild(container);
            fileInfo.textContent = "Microsoft Excel / CSV Document";
        } else if (currentFileType === "image") {
            const container = document.createElement("div");
            container.className = "page-container";
            container.dataset.pageNum = 1;

            const badge = document.createElement("div");
            badge.className = "page-size-badge";
            badge.textContent = "Image Document";
            container.appendChild(badge);

            const img = document.createElement("img");
            img.src = currentFileArrayBuffer;
            img.style.display = "block";
            img.style.maxWidth = "100%";
            container.appendChild(img);

            docContent.appendChild(container);
            fileInfo.textContent = "Image Document";
        }
    }

    function getPaperSizeName(w, h) {
        const width = w / 72;
        const height = h / 72;
        if (Math.abs(width - 8.27) < 0.2 && Math.abs(height - 11.69) < 0.2) return "A4";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 11.0) < 0.2) return "Letter";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 13.0) < 0.2) return "8.5 x 13 (Long)";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 14.0) < 0.2) return "US Legal";
        return "Custom Size";
    }

    // Signature Modal Logic
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { 
        sigModal.style.display = "flex"; 
        clearCanvas(); 
        document.getElementById("modalSignerName").value = "";
        document.getElementById("modalSigningDate").value = "";
    }
    
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    function saveSignature() {
        const targetPage = getActiveOrFirstPage();
        if (!targetPage) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const nameVal = document.getElementById("modalSignerName").value.trim();
        const dateVal = document.getElementById("modalSigningDate").value;

        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        let hasDrawing = false;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] > 0 && (data[i] < 220 || data[i+1] < 220 || data[i+2] < 220)) {
                hasDrawing = true;
            }
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) {
                data[i+3] = 0; 
            }
        }
        ctx.putImageData(imgData, 0, 0);

        const div = document.createElement("div");
        div.className = "draggable-item";

        let contentHTML = "";
        if (hasDrawing) {
            const signaturePngBase64 = sigCanvas.toDataURL("image/png");
            contentHTML += `<img src="${signaturePngBase64}" alt="Signature">`;
        }
        if (nameVal || dateVal) {
            contentHTML += `<div class="custom-text-node" style="font-size: 12px;">${nameVal ? nameVal : ''}${nameVal && dateVal ? '<br>' : ''}${dateVal ? dateVal : ''}</div>`;
        }

        if (!hasDrawing && !nameVal && !dateVal) {
            alert("Pakilagay ang iyong pirma, pangalan, o petsa.");
            return;
        }

        div.innerHTML = contentHTML + `<span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        
        // Posisyon sa gitna ng kasalukuyang tinitingnang pahina
        const pos = calculateInitialPosition(targetPage);
        div.style.left = pos.left + "px";
        div.style.top = pos.top + "px";

        targetPage.appendChild(div);
        makeDraggable(div);
        closeSigModal();
    }

    function addCustomTextToDoc() {
        const textVal = document.getElementById("customTextInput").value.trim();
        const fontSizeVal = document.getElementById("fontSizeInput").value || 14;

        if (!textVal) {
            alert("Pakitype muna ang teksto na nais mong idagdag.");
            return;
        }

        const targetPage = getActiveOrFirstPage();
        if (!targetPage) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.style.background = "transparent";

        div.innerHTML = `<div class="custom-text-node" style="font-size: ${fontSizeVal}px;">${textVal}</div><span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        
        // Posisyon sa gitna ng kasalukuyang tinitingnang pahina
        const pos = calculateInitialPosition(targetPage);
        div.style.left = pos.left + "px";
        div.style.top = pos.top + "px";

        targetPage.appendChild(div);
        makeDraggable(div);
        document.getElementById("customTextInput").value = "";
    }

    // Kinakalkula kung aling pahina ang PINAKANAKIKITA (Active Viewer Page)
    function getActiveOrFirstPage() {
        const pages = document.querySelectorAll(".page-container");
        if (pages.length === 0) return null;

        const wrapper = document.getElementById("docWrapper");
        const wrapperRect = wrapper.getBoundingClientRect();

        let maxVisibleHeight = 0;
        let activePage = pages[0];

        pages.forEach(page => {
            const rect = page.getBoundingClientRect();
            
            const visibleTop = Math.max(rect.top, wrapperRect.top);
            const visibleBottom = Math.min(rect.bottom, wrapperRect.bottom);
            const visibleHeight = Math.max(0, visibleBottom - visibleTop);

            if (visibleHeight > maxVisibleHeight) {
                maxVisibleHeight = visibleHeight;
                activePage = page;
            }
        });

        return activePage;
    }

    // Kinakalkula ang posisyon sa nakikitang bahagi ng pahina
    function calculateInitialPosition(page) {
        const wrapper = document.getElementById("docWrapper");
        const pageRect = page.getBoundingClientRect();
        const wrapperRect = wrapper.getBoundingClientRect();

        const visibleTopInViewport = Math.max(pageRect.top, wrapperRect.top);
        const visibleBottomInViewport = Math.min(pageRect.bottom, wrapperRect.bottom);
        const visibleCenterY = (visibleTopInViewport + visibleBottomInViewport) / 2;

        let top = visibleCenterY - pageRect.top - 30;
        let left = (pageRect.width / 2) - 80;

        if (top < 20) top = 20;
        if (top > pageRect.height - 60) top = pageRect.height - 60;
        if (left < 20) left = 20;

        return { left: Math.round(left), top: Math.round(top) };
    }

    function makeDraggable(elmnt) {
        let startX = 0, startY = 0, initialX = 0, initialY = 0;

        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            startX = e.clientX;
            startY = e.clientY;
            initialX = elmnt.offsetLeft;
            initialY = elmnt.offsetTop;

            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            elmnt.style.left = (initialX + dx) + "px";
            elmnt.style.top = (initialY + dy) + "px";

            checkAndMoveToNewPage(elmnt, e.clientX, e.clientY);
        }

        function closeDragElement() { 
            document.onmouseup = null; 
            document.onmousemove = null; 
        }

        function dragTouchStart(e) {
            if (e.target.classList.contains('delete-btn')) return;
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            initialX = elmnt.offsetLeft;
            initialY = elmnt.offsetTop;

            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchDragMove;
        }

        function touchDragMove(e) {
            const touch = e.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;

            elmnt.style.left = (initialX + dx) + "px";
            elmnt.style.top = (initialY + dy) + "px";

            checkAndMoveToNewPage(elmnt, touch.clientX, touch.clientY);
        }

        function closeTouchDrag() { 
            document.ontouchend = null; 
            document.ontouchmove = null; 
        }
    }

    function checkAndMoveToNewPage(elmnt, clientX, clientY) {
        const pages = document.querySelectorAll(".page-container");
        pages.forEach(page => {
            const rect = page.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                const currentParent = elmnt.closest(".page-container");
                if (currentParent !== page) {
                    const elmntRect = elmnt.getBoundingClientRect();
                    const newLeft = elmntRect.left - rect.left;
                    const newTop = elmntRect.top - rect.top;

                    page.appendChild(elmnt);
                    elmnt.style.left = Math.max(0, newLeft) + "px";
                    elmnt.style.top = Math.max(0, newTop) + "px";
                }
            }
        });
    }

    function saveAllAsPDF() {
        if (!currentFileArrayBuffer && docContent.innerHTML.includes("Wala pang naka-upload")) {
            alert("Mag-upload muna ng dokumento!");
            return;
        }

        const selectedSize = document.getElementById("paperSize").value;
        let pdfFormat = 'letter';
        if (selectedSize === 'a4') pdfFormat = 'a4';
        else if (selectedSize === 'legal') pdfFormat = 'legal';
        else if (selectedSize === 'legal8513') pdfFormat = [8.5, 13];

        const deleteBtns = document.querySelectorAll(".delete-btn");
        const badges = document.querySelectorAll(".page-size-badge");
        
        deleteBtns.forEach(btn => btn.style.display = "none");
        badges.forEach(b => b.style.display = "none");

        const opt = {
            margin:       0,
            filename:     'Signed_Document.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false },
            jsPDF:        { unit: 'in', format: pdfFormat, orientation: 'portrait' }
        };

        html2pdf().set(opt).from(docContent).save().then(() => {
            deleteBtns.forEach(btn => btn.style.display = "inline");
            badges.forEach(b => b.style.display = "block");
        });
    }
</script>
