<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 12px; text-align: left; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input[type="file"], input[type="text"], input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-purple { background: #6f42c1; color: white; font-size: 15px; }

        /* Workspace */
        #docWrapper {
            position: relative;
            margin-top: 15px;
            border: 2px dashed #ccc;
            padding: 10px;
            background: #525659;
            border-radius: 4px;
            overflow: auto;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .page-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Badge para sa Page Size */
        .page-size-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Draggable & Resizable Items */
        .draggable-item {
            position: absolute;
            top: 40px;
            left: 40px;
            cursor: move;
            border: 1.5px dashed #007bff;
            padding: 4px;
            background: rgba(255, 255, 255, 0.4);
            user-select: none;
            touch-action: none;
            z-index: 100;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 80px;
            min-height: 40px;
            width: 160px;
            text-align: center;
        }

        .draggable-item img {
            width: 100%;
            height: auto;
            max-height: 80px;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .draggable-item .sig-text-info {
            font-size: 12px;
            font-weight: bold;
            color: #000;
            margin-top: 2px;
            line-height: 1.2;
            pointer-events: none;
        }

        .delete-btn {
            font-size: 11px;
            color: red;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            top: 0; right: 0;
            background: white;
            padding: 0 4px;
            border-radius: 0 0 0 4px;
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            z-index: 10;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 420px; box-sizing: border-box; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF):</label>
        <input type="file" id="fileInput" accept=".pdf" onchange="handleFileSelect(event)">
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn btn-purple" onclick="openSigModal()">✍️ Magdagdag ng Pirma / Detalye</button>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <div id="docContent" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <p style="color: #ccc; font-style: italic; padding: 40px; text-align: center;">Wala pang naka-upload na PDF.</p>
        </div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Details Box -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <button class="btn btn-green" onclick="saveAllSignaturesAndTextPDF()">💾 I-save ang Lahat ng Pirma at Detalye sa PDF</button>
    </div>
</div>

<!-- Signature Pad Modal (May Optional Name at Date) -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">✍️ Lagda at Detalye</h3>
        <canvas id="sigCanvas" width="340" height="150"></canvas>
        
        <div style="margin-top: 10px; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #eee;">
            <div class="form-group">
                <label>Pangalan / Printed Name (Optional):</label>
                <input type="text" id="modalSignerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Petsa / Date (Optional):</label>
                <input type="date" id="modalSigningDate">
            </div>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 8px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura Canvas</button>
            <button class="btn btn-purple" onclick="saveSignature()">Idagdag sa Dokyumento</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let pdfDocGlobal = null;

    const docContent = document.getElementById("docContent");
    const fileInfo = document.getElementById("fileInfo");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            renderDocument();
        };
        reader.readAsArrayBuffer(file);
    }

    function renderDocument() {
        docContent.innerHTML = "";

        pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
            pdfDocGlobal = pdfDoc;
            fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDoc.numPages} Pahina)`;

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                pdfDoc.getPage(i).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const pdfView = page.getViewport({ scale: 1.0 });
                    const widthInches = (pdfView.width / 72).toFixed(1);
                    const heightInches = (pdfView.height / 72).toFixed(1);
                    let sizeName = getPaperSizeName(pdfView.width, pdfView.height);

                    const container = document.createElement("div");
                    container.className = "page-container";
                    container.dataset.pageNum = i;

                    const badge = document.createElement("div");
                    badge.className = "page-size-badge";
                    badge.textContent = `Pahina ${i}: ${sizeName} (${widthInches}" x ${heightInches}")`;
                    container.appendChild(badge);

                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);

                    docContent.appendChild(container);
                    page.render({ canvasContext: context, viewport: viewport });
                });
            }
        });
    }

    function getPaperSizeName(w, h) {
        const width = w / 72;
        const height = h / 72;
        if (Math.abs(width - 8.27) < 0.2 && Math.abs(height - 11.69) < 0.2) return "A4";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 11.0) < 0.2) return "Letter";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 13.0) < 0.2) return "8.5 x 13 (Long)";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 14.0) < 0.2) return "US Legal";
        return "Custom Size";
    }

    // Signature Pad Modal
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { 
        sigModal.style.display = "flex"; 
        clearCanvas(); 
        document.getElementById("modalSignerName").value = "";
        document.getElementById("modalSigningDate").value = "";
    }
    
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    // Isave ang pirma kasama ang opsyonal na Name at Date
    function saveSignature() {
        const targetPage = getActiveOrFirstPage();
        if (!targetPage) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const nameVal = document.getElementById("modalSignerName").value.trim();
        const dateVal = document.getElementById("modalSigningDate").value;

        // Kunin ang pirma mula sa canvas
        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        let hasDrawing = false;

        for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] > 0 && (data[i] < 220 || data[i+1] < 220 || data[i+2] < 220)) {
                hasDrawing = true;
            }
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) {
                data[i+3] = 0; // Transparent Background
            }
        }
        ctx.putImageData(imgData, 0, 0);

        const div = document.createElement("div");
        div.className = "draggable-item";

        let contentHTML = "";

        if (hasDrawing) {
            const signaturePngBase64 = sigCanvas.toDataURL("image/png");
            contentHTML += `<img src="${signaturePngBase64}" alt="Signature">`;
        }

        if (nameVal || dateVal) {
            contentHTML += `<div class="sig-text-info">${nameVal ? nameVal : ''}${nameVal && dateVal ? '<br>' : ''}${dateVal ? dateVal : ''}</div>`;
        }

        if (!hasDrawing && !nameVal && !dateVal) {
            alert("Pakilagay ang iyong pirma, pangalan, o petsa.");
            return;
        }

        div.innerHTML = contentHTML + `<span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        targetPage.appendChild(div);
        makeDraggable(div);
        closeSigModal();
    }

    function getActiveOrFirstPage() {
        const pages = document.querySelectorAll(".page-container");
        if (pages.length === 0) return null;

        const wrapper = document.getElementById("docWrapper");
        const wrapperRect = wrapper.getBoundingClientRect();
        
        for (const page of pages) {
            const rect = page.getBoundingClientRect();
            if (rect.top >= wrapperRect.top - 100 && rect.top <= wrapperRect.bottom) {
                return page;
            }
        }
        return pages[0];
    }

    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
            pos3 = e.clientX; pos4 = e.clientY;
            
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            
            checkAndMoveToNewPage(elmnt, e.clientX, e.clientY);
        }

        function closeDragElement() { 
            document.onmouseup = null; 
            document.onmousemove = null; 
        }

        function dragTouchStart(e) {
            if (e.target.classList.contains('delete-btn')) return;
            const touch = e.touches[0];
            pos3 = touch.clientX; pos4 = touch.clientY;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchTouchDragMove;
        }

        function touchTouchDragMove(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX; pos2 = touch.clientX;
            pos3 = touch.clientX; pos4 = touch.clientY;
            
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";

            checkAndMoveToNewPage(elmnt, touch.clientX, touch.clientY);
        }

        function closeTouchDrag() { 
            document.ontouchend = null; 
            document.ontouchmove = null; 
        }
    }

    function checkAndMoveToNewPage(elmnt, clientX, clientY) {
        const pages = document.querySelectorAll(".page-container");
        pages.forEach(page => {
            const rect = page.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                const currentParent = elmnt.closest(".page-container");
                if (currentParent !== page) {
                    const newLeft = clientX - rect.left - (elmnt.offsetWidth / 2);
                    const newTop = clientY - rect.top - (elmnt.offsetHeight / 2);
                    
                    page.appendChild(elmnt);
                    elmnt.style.left = Math.max(0, newLeft) + "px";
                    elmnt.style.top = Math.max(0, newTop) + "px";
                }
            }
        });
    }

    // Pag-save ng Pirma + Teksto
    async function saveAllSignaturesAndTextPDF() {
        if (!currentFileArrayBuffer) {
            alert("Mag-upload muna ng dokumento!");
            return;
        }

        try {
            const pdfDoc = await PDFLib.PDFDocument.load(currentFileArrayBuffer);
            const pages = pdfDoc.getPages();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

            const draggableItems = document.querySelectorAll(".draggable-item");

            for (const item of draggableItems) {
                const pageContainer = item.closest(".page-container");
                if (!pageContainer) continue;

                const pageNum = parseInt(pageContainer.dataset.pageNum) - 1;
                const targetPage = pages[pageNum];
                const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

                const containerRect = pageContainer.getBoundingClientRect();
                const itemRect = item.getBoundingClientRect();

                const relX = itemRect.left - containerRect.left;
                const relY = itemRect.top - containerRect.top;

                const scaleX = pdfWidth / containerRect.width;
                const scaleY = pdfHeight / containerRect.height;

                const pdfX = relX * scaleX;
                const pdfY = pdfHeight - ((relY + item.offsetHeight) * scaleY);

                const imgTag = item.querySelector("img");
                const textDiv = item.querySelector(".sig-text-info");

                // Kung may Pirma
                if (imgTag) {
                    const imgHeightBox = imgTag.offsetHeight * scaleY;
                    const imgWidthBox = item.offsetWidth * scaleX;
                    const sigY = textDiv ? pdfY + (textDiv.offsetHeight * scaleY) : pdfY;

                    const signatureImage = await pdfDoc.embedPng(imgTag.src);
                    targetPage.drawImage(signatureImage, {
                        x: pdfX,
                        y: sigY,
                        width: imgWidthBox,
                        height: imgHeightBox,
                    });
                }

                // Kung may kasamang Name / Date sa ibaba ng pirma
                if (textDiv) {
                    const textContent = textDiv.innerText.trim();
                    const lines = textContent.split("\n");
                    let currentY = pdfY + 12;

                    for (const line of lines) {
                        if (line.trim() !== "") {
                            targetPage.drawText(line.trim(), {
                                x: pdfX + 5,
                                y: currentY,
                                size: 10,
                                font: font,
                                color: PDFLib.rgb(0, 0, 0),
                            });
                            currentY -= 12;
                        }
                    }
                }
            }

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Signed_Document.pdf";
            link.click();

            alert("Matagumpay na na-save ang lahat ng pirma at detalye!");
        } catch (err) {
            console.error(err);
            alert("Nagkaroon ng problema sa pag-save: " + err.message);
        }
    }
</script>

</body>
</html>
