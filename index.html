<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], input[type="text"], input[type="date"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-purple { background: #6f42c1; color: white; font-size: 15px; }

        /* Workspace */
        #docWrapper {
            position: relative;
            margin-top: 15px;
            border: 2px dashed #ccc;
            padding: 10px;
            background: #525659;
            border-radius: 4px;
            overflow: auto;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .page-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Badge para makita ang size ng bawat pahina */
        .page-size-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 50;
            pointer-events: none;
        }

        /* Draggable & Resizable Items (Pwede nang madagdagan ng marami) */
        .draggable-item {
            position: absolute;
            top: 40px;
            right: 40px;
            cursor: move;
            border: 1.5px dashed #007bff;
            padding: 2px;
            background: rgba(255, 255, 255, 0.2);
            user-select: none;
            touch-action: none;
            z-index: 100;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 30px;
            width: 140px;
        }

        .draggable-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .delete-btn {
            font-size: 11px;
            color: red;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            top: 0; right: 0;
            background: white;
            padding: 0 4px;
            border-radius: 0 0 0 4px;
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF, Word, Excel, o Image):</label>
        <input type="file" id="fileInput" accept=".pdf, .docx, .xlsx, .xls, .csv, image/*" onchange="handleFileSelect(event)">
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn btn-purple" onclick="openSigModal()">✍️ Magdagdag ng Pirma (Add Signature)</button>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <div id="docContent" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <p style="color: #ccc; font-style: italic; padding: 40px; text-align: center;">Wala pang naka-upload na dokumento.</p>
        </div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Details Box -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <h3>📋 Detalye ng Pumirma</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Pangalan (Printed Name):</label>
                <input type="text" id="signerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Petsa:</label>
                <input type="date" id="signingDate">
            </div>
        </div>
        <button class="btn btn-secondary" onclick="addTextToDoc()">➕ Ilagay ang Pangalan at Petsa sa Unang Pahina</button>
        <button class="btn btn-green" onclick="downloadMultiElementHighQualityPDF()" style="margin-top: 15px;">💾 I-save ang Lahat ng Pirma at Detalye sa PDF</button>
    </div>
</div>

<!-- Signature Pad Modal -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3>✍️ I-guhit ang iyong Pirma</h3>
        <canvas id="sigCanvas" width="320" height="160"></canvas>
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura</button>
            <button class="btn btn-purple" onclick="saveSignature()">Idagdag sa Dokyumento</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let currentFileType = "";
    let pdfDocGlobal = null;

    const docContent = document.getElementById("docContent");
    const fileInfo = document.getElementById("fileInfo");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentFileType = file.type;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            renderDocument();
        };

        if (fileName.endsWith(".pdf") || currentFileType === "application/pdf") {
            currentFileType = "pdf";
            reader.readAsArrayBuffer(file);
        } else if (file.type.startsWith("image/")) {
            currentFileType = "image";
            reader.readAsDataURL(file);
        } else {
            alert("Sa kasalukuyan, ang multi-signature placement ay pinakamainam para sa mga PDF at Images.");
        }
    }

    function renderDocument() {
        docContent.innerHTML = "";

        if (currentFileType === "pdf") {
            pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
                pdfDocGlobal = pdfDoc;
                fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDoc.numPages} Pahina)`;

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    pdfDoc.getPage(i).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.8 });
                        
                        // Tukuyin ang sukat ng papel sa inches o mm para sa badge
                        const pdfView = page.getViewport({ scale: 1.0 });
                        const widthInches = (pdfView.width / 72).toFixed(1);
                        const heightInches = (pdfView.height / 72).toFixed(1);
                        let sizeName = getPaperSizeName(pdfView.width, pdfView.height);

                        const container = document.createElement("div");
                        container.className = "page-container";
                        container.dataset.pageNum = i;

                        // Badge na nagpapakita ng automatic page size
                        const badge = document.createElement("div");
                        badge.className = "page-size-badge";
                        badge.textContent = `Pahina ${i}: ${sizeName} (${widthInches}" x ${heightInches}")`;
                        container.appendChild(badge);

                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        container.appendChild(canvas);

                        docContent.appendChild(container);
                        page.render({ canvasContext: context, viewport: viewport });
                    });
                }
            });
        }
    }

    function getPaperSizeName(w, h) {
        // Points conversion (1 inch = 72 points)
        const width = w / 72;
        const height = h / 72;
        
        if (Math.abs(width - 8.27) < 0.2 && Math.abs(height - 11.69) < 0.2) return "A4";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 11.0) < 0.2) return "Letter";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 13.0) < 0.2) return "8.5 x 13 (Long)";
        if (Math.abs(width - 8.5) < 0.2 && Math.abs(height - 14.0) < 0.2) return "US Legal";
        return "Custom Size";
    }

    // Signature Pad Modal
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { sigModal.style.display = "flex"; clearCanvas(); }
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    // I-save ang Transparent Signature para payagan ang maramihang pirma
    function saveSignature() {
        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) {
                data[i+3] = 0; 
            }
        }
        ctx.putImageData(imgData, 0, 0);
        const signaturePngBase64 = sigCanvas.toDataURL("image/png");
        
        const firstPageContainer = document.querySelector(".page-container");
        if (!firstPageContainer) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item signature-node";
        div.innerHTML = `<img src="${signaturePngBase64}" alt="Signature"><span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        firstPageContainer.appendChild(div);
        makeDraggable(div);
        closeSigModal();
    }

    function addTextToDoc() {
        const name = document.getElementById("signerName").value;
        const date = document.getElementById("signingDate").value;

        if (!name && !date) {
            alert("Ilagay muna ang Pangalan o Petsa.");
            return;
        }

        const firstPageContainer = document.querySelector(".page-container");
        if (!firstPageContainer) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item text-node";
        div.style.background = "transparent";
        div.style.fontWeight = "bold";
        div.style.color = "#000";
        div.style.fontSize = "14px";
        div.style.width = "auto";
        div.innerHTML = `${name}<br>${date} <span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;

        firstPageContainer.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }
        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
            pos3 = e.clientX; pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }

        function dragTouchStart(e) {
            if (e.target.classList.contains('delete-btn')) return;
            const touch = e.touches[0];
            pos3 = touch.clientX; pos4 = touch.clientY;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchDrag;
        }
        function touchDrag(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
            pos3 = touch.clientX; pos4 = touch.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeTouchDrag() { document.ontouchend = null; document.ontouchmove = null; }
    }

    // Suportahan ang pag-save ng LAHAT ng idinagdag na pirma at elemento nang sabay-sabay
    async function downloadMultiElementHighQualityPDF() {
        if (!currentFileArrayBuffer) {
            alert("Mag-upload muna ng dokumento!");
            return;
        }

        if (currentFileType !== "pdf") {
            alert("Ang multi-signature preservation mode ay para sa PDF files.");
            return;
        }

        try {
            const pdfDoc = await PDFLib.PDFDocument.load(currentFileArrayBuffer);
            const pages = pdfDoc.getPages();

            // Kunin ang lahat ng idinagdag na draggable items sa screen (maraming pirma o teksto)
            const draggableItems = document.querySelectorAll(".draggable-item");

            for (const item of draggableItems) {
                const pageContainer = item.closest(".page-container");
                if (!pageContainer) continue;

                const pageNum = parseInt(pageContainer.dataset.pageNum) - 1;
                const targetPage = pages[pageNum];
                const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

                const canvasElem = pageContainer.querySelector("canvas");
                const containerRect = pageContainer.getBoundingClientRect();
                const itemRect = item.getBoundingClientRect();

                const relX = itemRect.left - containerRect.left;
                const relY = itemRect.top - containerRect.top;

                const scaleX = pdfWidth / containerRect.width;
                const scaleY = pdfHeight / containerRect.height;

                const pdfX = relX * scaleX;
                const pdfY = pdfHeight - ((relY + item.offsetHeight) * scaleY);
                const pdfWidthBox = item.offsetWidth * scaleX;
                const pdfHeightBox = item.offsetHeight * scaleY;

                // Suriin kung ito ba ay Signature (Image) o Text
                const imgTag = item.querySelector("img");
                if (imgTag) {
                    const imgSrc = imgTag.src;
                    const signatureImage = await pdfDoc.embedPng(imgSrc);
                    targetPage.drawImage(signatureImage, {
                        x: pdfX,
                        y: pdfY,
                        width: pdfWidthBox,
                        height: pdfHeightBox,
                    });
                }
            }

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Signed_MultiSignature_Document.pdf";
            link.click();

            alert("Matagumpay na na-download ang dokumento na may kasamang lahat ng pirma!");
        } catch (err) {
            console.error(err);
            alert("Nagkaroon ng problema sa pag-save: " + err.message);
        }
    }
</script>

</body>
</html>
