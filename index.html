<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries -->
    <!-- PDF.js para sa malinaw na rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- PDF-Lib para sa direktang pag-inject ng pirma nang malinaw at sakto sa sukat -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- Mammoth (Word) at SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], input[type="text"], input[type="date"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #007bff; color: white; width: 100%; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-purple { background: #6f42c1; color: white; font-size: 15px; }

        /* Document Workspace Container */
        #docWrapper {
            position: relative;
            margin-top: 15px;
            border: 2px dashed #ccc;
            padding: 10px;
            background: #525659; /* Standard PDF Viewer Dark Background para malinaw ang pahina */
            border-radius: 4px;
            overflow: auto;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .page-container canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Draggable & Resizable Items */
        .draggable-item {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: move;
            border: 1.5px dashed #007bff;
            padding: 2px;
            background: rgba(255, 255, 255, 0.2);
            user-select: none;
            touch-action: none;
            z-index: 100;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 30px;
            width: 150px;
        }

        .draggable-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .delete-btn {
            font-size: 11px;
            color: red;
            cursor: pointer;
            font-weight: bold;
            position: absolute;
            top: 0; right: 0;
            background: white;
            padding: 0 4px;
            border-radius: 0 0 0 4px;
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }
        .excel-table { border-collapse: collapse; width: 100%; font-size: 12px; background: white; }
        .excel-table th, .excel-table td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF, Word, Excel, o Image):</label>
        <input type="file" id="fileInput" accept=".pdf, .docx, .xlsx, .xls, .csv, image/*" onchange="handleFileSelect(event)">
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn btn-purple" onclick="openSigModal()">✍️ Pumirma Dito (Draw Signature)</button>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <div id="docContent" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <p style="color: #ccc; font-style: italic; padding: 40px; text-align: center;">Wala pang naka-upload na dokumento.</p>
        </div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Details Box -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <h3>📋 Detalye ng Pumirma</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Pangalan (Printed Name):</label>
                <input type="text" id="signerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Petsa:</label>
                <input type="date" id="signingDate">
            </div>
        </div>
        <button class="btn btn-secondary" onclick="addTextToDoc()">➕ Ilagay ang Pangalan at Petsa sa Unang Pahina</button>
        <button class="btn btn-green" onclick="downloadOriginalHighQualityPDF()">💾 I-save bilang Malinaw na Original PDF</button>
    </div>
</div>

<!-- Signature Pad Modal -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3>✍️ I-guhit ang iyong Pirma</h3>
        <canvas id="sigCanvas" width="320" height="160"></canvas>
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura</button>
            <button class="btn btn-purple" onclick="saveSignature()">Ilagay</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let currentFileType = "";
    let pdfDocGlobal = null;
    let lastSignaturePngBase64 = null;

    const docContent = document.getElementById("docContent");
    const fileInfo = document.getElementById("fileInfo");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentFileType = file.type;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            renderDocument();
        };

        if (fileName.endsWith(".pdf") || currentFileType === "application/pdf") {
            currentFileType = "pdf";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".docx")) {
            currentFileType = "docx";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls") || fileName.endsWith(".csv")) {
            currentFileType = "excel";
            reader.readAsArrayBuffer(file);
        } else if (file.type.startsWith("image/")) {
            currentFileType = "image";
            reader.readAsDataURL(file);
        } else {
            alert("Format not supported.");
        }
    }

    // High Quality Render gamit ang PDF.js (HD Scale = 2.0 para napakalinaw)
    function renderDocument() {
        docContent.innerHTML = "";

        if (currentFileType === "pdf") {
            pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
                pdfDocGlobal = pdfDoc;
                fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDoc.numPages} Pahina)`;

                for (let i = 1; i <= pdfDoc.numPages; i++) {
                    pdfDoc.getPage(i).then(function(page) {
                        // High-DPI scale para malinaw sa screen
                        const viewport = page.getViewport({ scale: 1.8 });

                        const container = document.createElement("div");
                        container.className = "page-container";
                        container.dataset.pageNum = i;

                        const canvas = document.createElement("canvas");
                        const context = canvas.getContext("2d");
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        container.appendChild(canvas);

                        docContent.appendChild(container);

                        page.render({ canvasContext: context, viewport: viewport });
                    });
                }
            });
        } else if (currentFileType === "docx") {
            mammoth.convertToHtml({ arrayBuffer: currentFileArrayBuffer })
                .then(function(result) {
                    const div = document.createElement("div");
                    div.className = "page-container";
                    div.style.padding = "30px";
                    div.style.maxWidth = "800px";
                    div.innerHTML = result.value;
                    docContent.appendChild(div);
                    fileInfo.textContent = "Microsoft Word Document (.docx)";
                });
        } else if (currentFileType === "excel") {
            const data = new Uint8Array(currentFileArrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const htmlString = XLSX.utils.sheet_to_html(firstSheet);
            
            const div = document.createElement("div");
            div.className = "page-container";
            div.style.padding = "15px";
            div.innerHTML = htmlString;
            const tbl = div.querySelector("table");
            if (tbl) tbl.className = "excel-table";
            docContent.appendChild(div);
            fileInfo.textContent = "Microsoft Excel / CSV Document";
        } else if (currentFileType === "image") {
            const div = document.createElement("div");
            div.className = "page-container";
            const img = document.createElement("img");
            img.src = currentFileArrayBuffer;
            img.style.maxWidth = "100%";
            div.appendChild(img);
            docContent.appendChild(div);
            fileInfo.textContent = "Image Document";
        }
    }

    // Signature Pad Modal Logic
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { sigModal.style.display = "flex"; clearCanvas(); }
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    // I-save ang Transparent Signature
    function saveSignature() {
        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 220 && data[i+1] > 220 && data[i+2] > 220) {
                data[i+3] = 0; // Transparent Background
            }
        }
        ctx.putImageData(imgData, 0, 0);
        lastSignaturePngBase64 = sigCanvas.toDataURL("image/png");
        
        const firstPageContainer = document.querySelector(".page-container");
        if (!firstPageContainer) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.id = "userSignatureItem";
        div.innerHTML = `<img src="${lastSignaturePngBase64}" alt="Signature"><span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;
        firstPageContainer.appendChild(div);
        makeDraggable(div);
        closeSigModal();
    }

    function addTextToDoc() {
        const name = document.getElementById("signerName").value;
        const date = document.getElementById("signingDate").value;

        if (!name && !date) {
            alert("Ilagay muna ang Pangalan o Petsa.");
            return;
        }

        const firstPageContainer = document.querySelector(".page-container");
        if (!firstPageContainer) {
            alert("Mag-upload muna ng dokumento.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.style.background = "transparent";
        div.style.fontWeight = "bold";
        div.style.color = "#000";
        div.style.fontSize = "14px";
        div.style.width = "auto";
        div.innerHTML = `${name}<br>${date} <span class="delete-btn" onclick="this.parentElement.remove()">✕</span>`;

        firstPageContainer.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.classList.contains('delete-btn')) return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }
        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
            pos3 = e.clientX; pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }

        function dragTouchStart(e) {
            if (e.target.classList.contains('delete-btn')) return;
            const touch = e.touches[0];
            pos3 = touch.clientX; pos4 = touch.clientY;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchDrag;
        }
        function touchDrag(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
            pos3 = touch.clientX; pos4 = touch.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeTouchDrag() { document.ontouchend = null; document.ontouchmove = null; }
    }

    // High Quality PDF Saving gamit ang PDF-Lib (Ina-preserve ang totoong Vector at Paper Size ng PDF)
    async function downloadOriginalHighQualityPDF() {
        if (!currentFileArrayBuffer) {
            alert("Mag-upload muna ng dokumento!");
            return;
        }

        if (currentFileType !== "pdf") {
            alert("Ang High Quality Preserve mode ay para sa PDF files. Ginagawan na ito ng paraan.");
            return;
        }

        try {
            // Load original PDF gamit ang PDFLib
            const pdfDoc = await PDFLib.PDFDocument.load(currentFileArrayBuffer);
            const pages = pdfDoc.getPages();

            // Hanapin ang Signature element sa screen
            const sigElem = document.getElementById("userSignatureItem");
            
            if (sigElem && lastSignaturePngBase64) {
                // Kunin kung saang page container nakalagay ang pirma
                const pageContainer = sigElem.closest(".page-container");
                const pageNum = pageContainer ? parseInt(pageContainer.dataset.pageNum) - 1 : 0;
                const targetPage = pages[pageNum];

                // Kunin ang tunay na laki ng pahina sa PDF
                const { width: pdfWidth, height: pdfHeight } = targetPage.getSize();

                // Kunin ang laki ng pahina sa screen (HTML Canvas)
                const canvasElem = pageContainer.querySelector("canvas");
                const rect = canvasElem.getBoundingClientRect();
                const containerRect = pageContainer.getBoundingClientRect();

                // Kunin ang exact relative X at Y coordinates sa screen
                const sigRect = sigElem.getBoundingClientRect();
                const relX = sigRect.left - containerRect.left;
                const relY = sigRect.top - containerRect.top;

                // I-calculate ang eksaktong Ratio mula Screen papuntang PDF
                const scaleX = pdfWidth / containerRect.width;
                const scaleY = pdfHeight / containerRect.height;

                const pdfX = relX * scaleX;
                // Sa PDF coordinates, ang Y=0 ay nasa ILALIM (Bottom-Left origin)
                const pdfY = pdfHeight - ((relY + sigElem.offsetHeight) * scaleY);

                const pdfSigWidth = sigElem.offsetWidth * scaleX;
                const pdfSigHeight = sigElem.offsetHeight * scaleY;

                // Embed PNG Signature sa PDF
                const signatureImage = await pdfDoc.embedPng(lastSignaturePngBase64);
                targetPage.drawImage(signatureImage, {
                    x: pdfX,
                    y: pdfY,
                    width: pdfSigWidth,
                    height: pdfSigHeight,
                });
            }

            // I-save ang Bagong PDF (Nananatiling 100% Orihinal ang linaw ng mga teksto)
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Signed_Original_Document.pdf";
            link.click();

            alert("Matagumpay na na-download ang malinaw at orihinal na PDF!");
        } catch (err) {
            console.error(err);
            alert("Nagkaroon ng problema sa pag-save ng PDF: " + err.message);
        }
    }
</script>

</body>
</html>
