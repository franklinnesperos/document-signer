<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Signature Manager</title>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="file"], input[type="text"], input[type="date"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #0056b3; }
        .btn-green { background: #28a745; margin-top: 10px; }
        .btn-secondary { background: #6c757d; width: auto; padding: 8px 15px; }
        .btn-purple { background: #6f42c1; width: auto; padding: 10px 20px; font-size: 15px; }

        /* Workspace */
        #docWrapper {
            position: relative;
            margin-top: 20px;
            border: 2px dashed #ccc;
            padding: 10px;
            background: #fafafa;
            border-radius: 4px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 350px;
        }

        #docContent {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: inline-block;
        }

        .page-container canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Pagination Bar */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Draggable & Resizable Items */
        .draggable-item {
            position: absolute;
            top: 50px;
            left: 50px;
            cursor: move;
            border: 1px dashed #007bff;
            padding: 2px;
            background: transparent;
            user-select: none;
            touch-action: none;
            z-index: 10;
            display: inline-block;
            resize: both;
            overflow: hidden;
            min-width: 60px;
            min-height: 30px;
        }
        .draggable-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 90%; max-width: 400px; }
        #sigCanvas { border: 2px solid #333; background: #fff; border-radius: 4px; cursor: crosshair; touch-action: none; }
        .excel-table { border-collapse: collapse; width: 100%; font-size: 12px; }
        .excel-table th, .excel-table td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 Document & Signature Manager</h2>
    
    <!-- Upload File -->
    <div class="form-group">
        <label>Mag-upload ng Dokumento (PDF, Word, Excel, o Image):</label>
        <input type="file" id="fileInput" accept=".pdf, .docx, .xlsx, .xls, .csv, image/*" onchange="handleFileSelect(event)">
    </div>

    <div class="form-group">
        <label>Sukat ng Papel (Paper Size):</label>
        <select id="paperSize">
            <option value="a4">A4 (210 × 297 mm)</option>
            <option value="letter" selected>Letter (8.5 × 11 in)</option>
            <option value="legal8513">8.5 × 13 in (Long)</option>
            <option value="legal">US Legal (8.5 × 14 in)</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap;">
        <button class="btn btn-purple" onclick="openSigModal()">✍️ Pumirma Dito</button>
    </div>

    <!-- Document Workspace -->
    <div id="docWrapper">
        <div id="docContent">
            <p style="color: #777; font-style: italic; padding: 40px; text-align: center;">Wala pang naka-upload na dokumento.</p>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div id="paginationControls" class="pagination-bar" style="display: none;">
        <button class="btn btn-secondary" onclick="prevPage()" style="padding: 5px 10px;">⬅️ Nakaraan</button>
        <span id="pageIndicator" style="font-weight: bold;">Pahina 1 ng 1</span>
        <div>
            <button class="btn btn-secondary" onclick="nextPage()" style="padding: 5px 10px; margin-right: 5px;">Susunod ➡️</button>
            <button class="btn btn-secondary" onclick="toggleViewAll()" id="viewAllBtn" style="padding: 5px 10px; background: #007bff; color: white;">🔍 Tingnan Lahat (See All)</button>
        </div>
    </div>

    <div id="fileInfo" style="text-align: center; margin-top: 8px; font-weight: bold; color: #555;"></div>

    <!-- Details Box -->
    <div style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <h3>📋 Detalye ng Pumirma</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Pangalan (Printed Name):</label>
                <input type="text" id="signerName" placeholder="Hal. Franklin P. Nesperos">
            </div>
            <div class="form-group" style="flex: 1; min-width: 200px;">
                <label>Petsa:</label>
                <input type="date" id="signingDate">
            </div>
        </div>
        <button class="btn btn-secondary" onclick="addTextToDoc()">➕ Ilagay ang Pangalan at Petsa sa Kasalukuyang Pahina</button>
        <button class="btn btn-green" onclick="downloadPDF()" style="margin-top: 15px;">💾 I-save at I-download ang Lahat ng Pahina bilang PDF</button>
    </div>
</div>

<!-- Signature Pad Modal -->
<div id="sigModal" class="modal">
    <div class="modal-content">
        <h3>✍️ I-guhit ang iyong Pirma</h3>
        <canvas id="sigCanvas" width="320" height="160"></canvas>
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
            <button class="btn btn-secondary" onclick="clearCanvas()">Bura</button>
            <button class="btn btn-purple" onclick="saveSignature()">Ilagay</button>
            <button class="btn btn-secondary" style="background: #dc3545;" onclick="closeSigModal()">Isara</button>
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let currentFileArrayBuffer = null;
    let currentFileType = "";
    let pdfDocGlobal = null;
    let pageNum = 1;
    let viewAllMode = true; // Default sa See All para madaling makita lahat ng pages at masave

    const docContent = document.getElementById("docContent");
    const fileInfo = document.getElementById("fileInfo");
    const paginationControls = document.getElementById("paginationControls");

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        currentFileType = file.type;
        const fileName = file.name.toLowerCase();
        const reader = new FileReader();

        reader.onload = function(e) {
            currentFileArrayBuffer = e.target.result;
            renderDocument();
        };

        if (fileName.endsWith(".pdf") || currentFileType === "application/pdf") {
            currentFileType = "pdf";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".docx")) {
            currentFileType = "docx";
            reader.readAsArrayBuffer(file);
        } else if (fileName.endsWith(".xlsx") || fileName.endsWith(".xls") || fileName.endsWith(".csv")) {
            currentFileType = "excel";
            reader.readAsArrayBuffer(file);
        } else if (file.type.startsWith("image/")) {
            currentFileType = "image";
            reader.readAsDataURL(file);
        } else {
            alert("Format not supported.");
        }
    }

    function renderDocument() {
        docContent.innerHTML = "";
        paginationControls.style.display = "none";

        if (currentFileType === "pdf") {
            pdfjsLib.getDocument(currentFileArrayBuffer).promise.then(function(pdfDoc) {
                pdfDocGlobal = pdfDoc;
                paginationControls.style.display = "flex";
                
                pdfDoc.getPage(1).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.0 });
                    detectPaperSizeFromPDF(viewport.width, viewport.height);
                });

                if (viewAllMode) {
                    renderAllPages();
                } else {
                    renderSinglePage(pageNum);
                }
            });
        } else if (currentFileType === "docx") {
            mammoth.convertToHtml({ arrayBuffer: currentFileArrayBuffer })
                .then(function(result) {
                    const div = document.createElement("div");
                    div.className = "page-container";
                    div.style.padding = "30px";
                    div.innerHTML = result.value;
                    docContent.appendChild(div);
                    fileInfo.textContent = "Microsoft Word Document (.docx)";
                });
        } else if (currentFileType === "excel") {
            const data = new Uint8Array(currentFileArrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const htmlString = XLSX.utils.sheet_to_html(firstSheet);
            
            const div = document.createElement("div");
            div.className = "page-container";
            div.style.padding = "15px";
            div.innerHTML = htmlString;
            const tbl = div.querySelector("table");
            if (tbl) tbl.className = "excel-table";
            docContent.appendChild(div);
            fileInfo.textContent = "Microsoft Excel / CSV Document";
        } else if (currentFileType === "image") {
            const div = document.createElement("div");
            div.className = "page-container";
            const img = document.createElement("img");
            img.src = currentFileArrayBuffer;
            div.appendChild(img);
            docContent.appendChild(div);
            fileInfo.textContent = "Image Document";
        }
    }

    function renderSinglePage(num) {
        pdfDocGlobal.getPage(num).then(function(page) {
            docContent.innerHTML = "";
            const viewport = page.getViewport({ scale: 1.5 });
            
            const container = document.createElement("div");
            container.className = "page-container";
            container.dataset.pageNum = num;

            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            container.appendChild(canvas);

            docContent.appendChild(container);

            page.render({ canvasContext: context, viewport: viewport });
            document.getElementById("pageIndicator").textContent = `Pahina ${num} ng ${pdfDocGlobal.numPages}`;
            fileInfo.textContent = `PDF Document (Kabuuan: ${pdfDocGlobal.numPages} Pahina)`;
        });
    }

    function renderAllPages() {
        docContent.innerHTML = "";
        for (let i = 1; i <= pdfDocGlobal.numPages; i++) {
            pdfDocGlobal.getPage(i).then(function(page) {
                const viewport = page.getViewport({ scale: 1.3 });
                
                const container = document.createElement("div");
                container.className = "page-container";
                container.dataset.pageNum = i;
                container.style.marginBottom = "25px";

                const label = document.createElement("div");
                label.style.background = "#0056b3";
                label.style.color = "white";
                label.style.padding = "4px 8px";
                label.style.fontSize = "12px";
                label.textContent = `Pahina ${i}`;
                container.appendChild(label);

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                container.appendChild(canvas);

                docContent.appendChild(container);
                page.render({ canvasContext: context, viewport: viewport });
            });
        }
        document.getElementById("pageIndicator").textContent = `Lahat ng ${pdfDocGlobal.numPages} Pahina ay Ipinapakita`;
        fileInfo.textContent = `PDF Document (All Pages View)`;
    }

    function nextPage() {
        if (!pdfDocGlobal) return;
        if (pageNum < pdfDocGlobal.numPages) {
            pageNum++;
            renderSinglePage(pageNum);
        }
    }

    function prevPage() {
        if (!pdfDocGlobal) return;
        if (pageNum > 1) {
            pageNum--;
            renderSinglePage(pageNum);
        }
    }

    function toggleViewAll() {
        viewAllMode = !viewAllMode;
        const btn = document.getElementById("viewAllBtn");
        if (viewAllMode) {
            btn.textContent = "📄 Isa-isang Pahina (Single Page)";
            renderAllPages();
        } else {
            btn.textContent = "🔍 Tingnan Lahat (See All)";
            pageNum = 1;
            renderSinglePage(pageNum);
        }
    }

    function detectPaperSizeFromPDF(width, height) {
        const select = document.getElementById("paperSize");
        if (height > width * 1.45) select.value = "legal";
        else if (height > width * 1.35) select.value = "legal8513";
        else select.value = "letter";
    }

    // Signature Pad Modal
    const sigModal = document.getElementById("sigModal");
    const sigCanvas = document.getElementById("sigCanvas");
    const ctx = sigCanvas.getContext("2d");
    let isDrawing = false;

    function openSigModal() { sigModal.style.display = "flex"; clearCanvas(); }
    function closeSigModal() { sigModal.style.display = "none"; }
    function clearCanvas() { ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }

    function getPos(e) {
        const rect = sigCanvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    sigCanvas.addEventListener("mousedown", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
    sigCanvas.addEventListener("mousemove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineTo(p.x, p.y); ctx.stroke(); });
    sigCanvas.addEventListener("mouseup", () => { isDrawing = false; });

    sigCanvas.addEventListener("touchstart", (e) => { isDrawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); });
    sigCanvas.addEventListener("touchmove", (e) => { if (!isDrawing) return; const p = getPos(e); ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); });
    sigCanvas.addEventListener("touchend", () => { isDrawing = false; });

    // Transparent Background para sa Signature (Tinatanggal ang white pixels)
    function saveSignature() {
        const imgData = ctx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
            // Kung maputi ang background, gawing transparent
            if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) {
                data[i+3] = 0; 
            }
        }
        ctx.putImageData(imgData, 0, 0);
        const dataUrl = sigCanvas.toDataURL("image/png");
        
        const activeContainer = document.querySelector(".page-container");
        if (!activeContainer) {
            alert("Pumili o magbukas muna ng pahina kung saan ilalagay ang pirma.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.style.width = "140px";
        div.innerHTML = `<img src="${dataUrl}" alt="Signature"><span style="font-size: 11px; color: red; cursor: pointer; font-weight: bold; position: absolute; top: 0; right: 2px; background: white; padding: 0 3px;" onclick="this.parentElement.remove()">✕</span>`;
        activeContainer.appendChild(div);
        makeDraggable(div);
        closeSigModal();
    }

    function addTextToDoc() {
        const name = document.getElementById("signerName").value;
        const date = document.getElementById("signingDate").value;

        if (!name && !date) {
            alert("Ilagay muna ang Pangalan o Petsa.");
            return;
        }

        const activeContainer = document.querySelector(".page-container");
        if (!activeContainer) {
            alert("Pumili o magbukas muna ng pahina.");
            return;
        }

        const div = document.createElement("div");
        div.className = "draggable-item";
        div.style.background = "transparent";
        div.style.fontWeight = "bold";
        div.style.color = "#000";
        div.style.fontSize = "14px";
        div.style.width = "auto";
        div.innerHTML = `${name}<br>${date} <span style="font-size: 11px; color: red; cursor: pointer; position: absolute; top: 0; right: -10px; background: white;" onclick="this.parentElement.remove()">✕</span>`;

        activeContainer.appendChild(div);
        makeDraggable(div);
    }

    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragTouchStart;

        function dragMouseDown(e) {
            if (e.target.tagName === 'SPAN') return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }
        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
            pos3 = e.clientX; pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }

        function dragTouchStart(e) {
            if (e.target.tagName === 'SPAN') return;
            const touch = e.touches[0];
            pos3 = touch.clientX; pos4 = touch.clientY;
            document.ontouchend = closeTouchDrag;
            document.ontouchmove = touchDrag;
        }
        function touchDrag(e) {
            const touch = e.touches[0];
            pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
            pos3 = touch.clientX; pos4 = touch.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }
        function closeTouchDrag() { document.ontouchend = null; document.ontouchmove = null; }
    }

    // Naayos para maisama at ma-download ang LAHAT ng pahina ng PDF
    function downloadPDF() {
        if (!currentFileArrayBuffer) {
            alert("Mag-upload muna ng dokumento!");
            return;
        }

        const selectedSize = document.getElementById("paperSize").value;
        let pdfFormat = 'letter';
        if (selectedSize === 'a4') pdfFormat = 'a4';
        else if (selectedSize === 'legal') pdfFormat = 'legal';
        else if (selectedSize === 'legal8513') pdfFormat = [8.5, 13];

        const closeBtns = document.querySelectorAll(".draggable-item span");
        closeBtns.forEach(btn => btn.style.display = "none");

        const opt = {
            margin:       0,
            filename:     'Signed_Document.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: pdfFormat, orientation: 'portrait' }
        };

        html2pdf().set(opt).from(docContent).save().then(() => {
            closeBtns.forEach(btn => btn.style.display = "inline");
        });
    }
</script>

</body>
</html>
